name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      update_visual_baselines:
        description: Generate visual baselines for review
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Quality checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Run unit and component tests
        run: npm run test:unit -- --run

      - name: Install browser dependencies
        run: npx playwright install --with-deps

      - name: Generate visual baselines for review
        if: ${{ inputs.update_visual_baselines }}
        run: npm run test:visual:update

      - name: Run production browser tests
        run: npm run test:e2e

      - name: Upload proposed visual baselines
        if: ${{ !cancelled() && inputs.update_visual_baselines }}
        uses: actions/upload-artifact@v7
        with:
          name: visual-baselines
          path: e2e/visual.spec.ts-snapshots/*-linux.png
          if-no-files-found: error
          retention-days: 7

      - name: Upload browser report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: ignore
          retention-days: 7
